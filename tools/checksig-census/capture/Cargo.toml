# Standalone workspace for the CHECKSIG census capture harness.
#
# Verifies every non-coinbase input in the KSPIKE1 corpus exactly once through
# the production bitcoinkernel path (KernelContext::verify_tx). No width loop,
# no Rayon, no timers, no preliminary correctness pass.
#
# The [patch.crates-io] redirects libbitcoinkernel-sys to the experiment copy
# that carries the native census instrumentation. The path dependency on
# bitcoin-rs-consensus pulls in the production kernel verify path unchanged.
[workspace]
resolver = "3"
members = ["."]

[patch.crates-io]
libbitcoinkernel-sys = { path = "../libbitcoinkernel-sys-0.3.0" }

[package]
name = "checksig-census-capture"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
publish = false

[dependencies]
libbitcoinkernel-sys = "=0.3.0"
bitcoin-rs-consensus = { path = "../../../crates/consensus", default-features = false, features = ["kernel"] }
bitcoin-rs-primitives = { path = "../../../crates/primitives" }
bitcoin-rs-script = { path = "../../../crates/script" }
bitcoin = { version = ">=0.32.9, <0.33", default-features = false, features = ["std", "secp-recovery", "serde", "rand-std"] }
anyhow = { version = ">=1.0.100, <2", default-features = false, features = ["std"] }
hashbrown = { version = ">=0.17.1, <0.18", default-features = false, features = ["inline-more", "default-hasher", "allocator-api2"] }
serde_json = { version = ">=1, <2", default-features = false, features = ["std", "raw_value"] }
