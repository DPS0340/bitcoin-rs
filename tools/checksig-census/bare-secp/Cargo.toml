[package]
name = "checksig-bare-secp"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
libbitcoinkernel-sys = { version = "=0.3.0", path = "../libbitcoinkernel-sys-0.3.0" }
secp256k1 = { version = "=0.31.1", default-features = false, features = ["std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
anyhow = { version = ">=1.0.100, <2", default-features = false, features = ["std"] }
