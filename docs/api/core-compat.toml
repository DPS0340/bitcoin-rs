# ---------------------------------------------------------------------------
# REST
#
# Deliberately small. #78 says to keep it that way until a concrete
# consumer needs more, and the one consumer today is the remote validator.
# The gateway is UNAUTHENTICATED: binding it to a public interface exposes
# chain data to anyone who can reach the port.
# ---------------------------------------------------------------------------

[[rest]]
path = "/rest/chaininfo.json"
status = "implemented_unverified"
note = "Same body as `getblockchaininfo`, so it inherits that method's status."

[[rest]]
path = "/rest/headers/<hash>.<json|hex|bin>"
status = "deviation"
deviation = "An unknown but well-formed block hash answers 200 with an empty result rather than 404, because the remote validator uses 404 on `/rest/*` to detect a disabled gateway and cannot afford the two to be confused. Query parameters other than `count` are ignored, as Core ignores cache-busters."

# ---------------------------------------------------------------------------
# ZMQ
#
# A low-latency projection of node state, not a durable replay mechanism.
# A subscriber that misses a message recovers from the durable source in
# #77, never from ZMQ. Publication failure cannot affect apply or consensus.
# ---------------------------------------------------------------------------

[[zmq]]
topic = "hashblock"
notifier = "pubhashblock"
status = "implemented_unverified"

[[zmq]]
topic = "hashtx"
notifier = "pubhashtx"
status = "implemented_unverified"

[[zmq]]
topic = "rawblock"
notifier = "pubrawblock"
status = "implemented_unverified"

[[zmq]]
topic = "rawtx"
notifier = "pubrawtx"
status = "implemented_unverified"

[[zmq]]
topic = "sequence"
notifier = "pubsequence"
status = "deviation"
deviation = "Block connect and disconnect events only. Core also publishes mempool accept and remove on this topic; those are unavailable until #74, so a subscriber must not read the absence of an A/R message as the absence of the event."
