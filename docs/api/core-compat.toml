[[rpc]]
method = "getmempoolinfo"
group = "mempool"
status = "deviation"
deviation = "`usage` is an estimate of this node's own structures, as Core's is of boost's; the two are not the same number for the same mempool. `maxmempool` bounds the virtual-size sum rather than `usage`, so unlike Core the two fields are not in the same currency and `usage` may exceed `maxmempool`. Five policy fields Core reports are absent because this node has no such policy knob to report, and `mempool_sequence` is emitted here though Core carries it on `getrawmempool` instead."
schema_missing = [
    "limitclustercount",
    "limitclustersize",
    "maxdatacarriersize",
    "optimal",
    "permitbaremultisig",
]
schema_extra = ["mempool_sequence"]

