# Bitcoin Core compatibility manifest
#
# The machine-readable inventory #78 scope item 1 asks for: one entry per RPC
# method, REST route and ZMQ topic this node exposes, each with the status it is
# claimed at and what has actually checked that claim.
#
# THIS FILE IS ENFORCED, NOT DESCRIBED. `crates/rpc/src/compat.rs` embeds it at
# compile time and cross-checks it against the dispatcher, the REST router, the
# ZMQ topic table and `Cargo.lock`. Adding a method without an entry here fails
# the test suite; so does an entry for a method that does not dispatch, and so
# does bumping the kernel crate without revisiting the pinned reference below.
#
# Anything absent from this file is `not_implemented` and answers JSON-RPC
# -32601. That is asserted rather than assumed -- see
# `an_unlisted_method_is_method_not_found`.

[reference]
# The Bitcoin Core revision every compatibility claim in this file is made
# against. Not a released Core version: 31.99 is Core's master convention for
# "after 31.x, before 32.0", so this is a pre-release snapshot and a claim made
# against it is a claim about master, not about anything an operator can install
# from a release tarball. Said plainly because a compatibility contract that
# quietly points at a moving target is worse than none.
core_version = "31.99.0"
# Where that revision comes from, and what makes the pin real: the node links
# libbitcoinkernel built from this tree, so the pin is load-bearing rather than
# documentary. `bitcoinkernel` is the safe wrapper; `libbitcoinkernel-sys`
# vendors the Core source under `bitcoin/`, and its `CMakeLists.txt` carries the
# CLIENT_VERSION above.
kernel_crate = "bitcoinkernel"
kernel_crate_version = "0.2.1"
kernel_sys_crate = "libbitcoinkernel-sys"
kernel_sys_crate_version = "0.3.0"
# Set when a differential harness compares *values* against a running reference
# (#78 scope item 2). Still false, and deliberately so: the shape comparison in
# `crates/rpc/src/compat/schema.rs` checks field names, types and optionality
# against Core's own declarations, which is real verification but not this one.
# A method whose shape matches can still answer a different number.
#
# No entry may claim `supported` while this is false, and the suite enforces it.
differential_harness = false

# Status vocabulary, in the order of decreasing confidence:
#
#   supported              implemented AND differentially verified against the
#                          pinned reference. Nothing qualifies yet; the harness
#                          does not exist. `differential_harness = false` above
#                          makes claiming it a test failure.
#   deviation              implemented, with a known and stated difference from
#                          the pinned reference. The difference is recorded in
#                          `deviation` on the entry, not only in prose
#                          elsewhere, so a client can read it.
#   implemented_unverified implemented; believed Core-shaped; nothing has
#                          compared it to the reference. This is the honest
#                          state of most of the surface today, and #78 lists
#                          "treating a Core method name as proof of behavioral
#                          compatibility" as a non-goal -- so the manifest
#                          refuses to call these supported.
#   disabled               refused by product policy with a stable error. This
#                          node holds no private keys.
#   not_implemented        not dispatched; answers -32601.
#
# Entries may also carry a field-level record of how the result shape differs
# from the one Core declares for the same method:
#
#   schema_missing     Core declares these and this node does not emit them.
#   schema_extra       This node emits these and Core does not declare them.
#   schema_mismatched  Both emit them, with disagreeing JSON types.
#
# These are checked, not written down: `crates/rpc/src/compat/schema.rs`
# dispatches the method, compares the answer against Core's own declared result
# schema, and requires the difference it finds to be exactly the difference
# recorded here. A field that starts differing fails; so does one recorded here
# that stops differing, because a stale deviation is a lie in the other
# direction.
#
# The schemas come from Core's `RPCResult` declarations, extracted by
# `tools/core-rpc-schema/extract.py` into `docs/api/core-rpc-schema.json`. That
# is a check of *shape* -- names, types, optionality -- and not of values.
# Values need a live Core, which #78 keeps as a separate documented lane, and
# is why a clean shape comparison still does not earn `supported`.


