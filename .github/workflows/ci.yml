name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  # ── Fast lanes (always run) ──────────────────────────────────────

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny --workspace --no-default-features --features "rocksdb,fjall,redb,kernel" check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: ./scripts/ci-pr.sh clippy

  test-crates:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: ./.github/actions/test-deps
      - run: ./scripts/ci-pr.sh test-crates

  # ── Heavy lanes (merge and main only) ────────────────────────────

  test-binary:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: ./.github/actions/native-deps
      - uses: ./.github/actions/test-deps
      - run: bash scripts/provision-ci-reference-fixtures.sh core
      - run: ./scripts/ci-pr.sh test-binary
      - name: Preserve process compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: process-compatibility-binary-${{ github.run_attempt }}
          path: target/process-harness/**
          if-no-files-found: warn
          retention-days: 7

  test-workspace:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: ./.github/actions/test-deps
      - run: bash scripts/provision-ci-reference-fixtures.sh core
      - run: ./scripts/ci-pr.sh test-workspace
      - name: Preserve process compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: process-compatibility-workspace-${{ github.run_attempt }}
          path: target/process-harness/**
          if-no-files-found: warn
          retention-days: 7

  # ── Single required check ────────────────────────────────────────
  #
  # On PRs: gates fmt, deny, clippy, test-crates.
  # On merge/main: also gates test-binary, test-workspace.
  # This is the one status check configured in the GitHub ruleset.

  ci-gate:
    if: always()
    runs-on: ubuntu-latest
    needs: [fmt, deny, clippy, test-crates, test-binary, test-workspace]
    steps:
      - name: Evaluate gate
        run: |
          echo "Fast lanes:"
          for job in fmt deny clippy test-crates; do
            echo "  $job: ${{ needs[job].result }}"
          done
          echo "Heavy lanes:"
          for job in test-binary test-workspace; do
            echo "  $job: ${{ needs[job].result }}"
          done

          # Fast lanes must succeed.
          for job in fmt deny clippy test-crates; do
            if [[ "${{ needs[job].result }}" != "success" ]]; then
              echo "::error::$job ${{ needs[job].result }}"
              exit 1
            fi
          done

          # Heavy lanes: success or skipped (PRs skip them).
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            for job in test-binary test-workspace; do
              if [[ "${{ needs[job].result }}" != "success" ]]; then
                echo "::error::$job ${{ needs[job].result }}"
                exit 1
              fi
            done
          fi

          echo "Gate passed."
