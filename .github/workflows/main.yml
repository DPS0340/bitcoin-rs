name: ci-main

# Deep lanes: everything that needs the C++ toolchain (libbitcoinkernel),
# nightly, lockfile mutation, or long runtimes. Never triggered by pull
# requests -- the fast gate in ci.yml is the only required-status job set for
# PRs.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Same design as ci.yml's concurrency block: one group per run, so `main`
# pushes never queue against each other and so are never cancelled (a pending
# run in a shared group would be cancelled by a third push and leave the
# commit with no CI record). This workflow never sees pull_request events, so
# there is nothing to cancel-in-progress.
concurrency:
  group: ci-main-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  # Full-node production feature set: all four storage backends plus the
  # bitcoinkernel script-verification engine (the kernel is built from C++ --
  # this workflow is the only place that installs its prerequisites).
  FULL_NODE_FEATURES: "rocksdb,fjall,redb,mdbx,kernel"

jobs:
  full-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The kernel engine is built from C++ (cmake + libboost-dev); the
      # full-node feature set includes it, so this lane installs the
      # prerequisites up front.
      - run: sudo apt-get update && sudo apt-get install -y libboost-dev cmake
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      # Node / binary tests run with the full-node feature set. -p is
      # required because `--workspace --features` silently ignores --features
      # in a virtual workspace (no root [package] section in the top-level
      # Cargo.toml).
      - run: |
          cargo test -p bitcoin-rs --no-fail-fast \
            --no-default-features --features "${FULL_NODE_FEATURES}"
      # Consensus fixture corpus: committed tests that are --ignored by
      # design (large deterministic vectors), so the workspace run never
      # picks them up.
      - run: cargo test -p bitcoin-rs-consensus --no-fail-fast -- --include-ignored
      # Full-node feature lint surface (the default-feature lint runs in
      # ci.yml). In a virtual workspace (no root [package]), `--features`
      # flags are not forwarded to library crates; use `-p bitcoin-rs` so the
      # binary's feature table propagates all backends and the kernel to
      # bitcoin-rs-node and its deps.
      - run: |
          cargo clippy -p bitcoin-rs --all-targets \
            --no-default-features --features "${FULL_NODE_FEATURES}" \
            -- -D warnings
          # -p bitcoin-rs-node catches test-target lints invisible to the line above
          # (virtual workspace: -p bitcoin-rs does not forward features to node's own
          # test targets, so their lints are silently skipped without this step).
          cargo clippy -p bitcoin-rs-node --all-targets -- -D warnings

  bench-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y libboost-dev cmake
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      # Compile exactly the 7 retained Criterion targets. Bin package has no bench
      # targets; all benchmarks live in their own crates. No allocator A/B lane:
      # the `bench-mimalloc` feature and duplicate compile were retired by #224
      # (bench-only mimalloc was a campaign artefact, not production). After #225
      # the script_index bench is added to this list.
      - run: |
          cargo bench -p bitcoin-rs-consensus --no-run --no-default-features --bench merkle
          cargo bench -p bitcoin-rs-consensus --no-run --no-default-features --bench verify_tx
          cargo bench -p bitcoin-rs-storage   --no-run --no-default-features --features fjall --bench kvstore_backends
          cargo bench -p bitcoin-rs-utxo     --no-run --no-default-features --features fjall --bench record_codec
          cargo bench -p bitcoin-rs-utxo     --no-run --no-default-features --features fjall --bench utxo_commit
          cargo bench -p bitcoin-rs-mining   --no-run --no-default-features --bench candidate
          cargo bench -p bitcoin-rs-node     --no-run --no-default-features --features fjall --bench sync_pipeline


  # The imported qa-assets corpora (fuzz/corpus/, provenance in
  # fuzz/CORPUS_PROVENANCE.md) only pay off if they are exercised: build every
  # target and give each 10k executions against its corpus.
  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: taiki-e/install-action@82fc405565b9cf90abfe700ba43b4751ce2fe422 # cargo-fuzz
      # Explicit host triple: some cargo-fuzz versions default to a musl
      # target that is not installed here, and only the GNU host target is
      # guaranteed on the runner.
      - run: cargo fuzz build --target x86_64-unknown-linux-gnu
      - run: |
          for target in p2p_message block_decode tx_decode script_eval utxo_snapshot; do
            cargo fuzz run "$target" --target x86_64-unknown-linux-gnu -- -runs=10000
          done

  # Main-only (issue #174): resolves every direct dependency at its oldest
  # allowed version and proves the workspace still compiles. Mutates
  # Cargo.lock, so it must never run on PR checkouts -- this workflow only
  # triggers on `main` pushes and manual dispatch.
  minimal-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The default build still pulls the C++ kernel engine until the
      # kernel-flip commit lands; harmless (just unused) afterwards.
      - run: sudo apt-get update && sudo apt-get install -y libboost-dev cmake
      # dtolnay action installs the newest nightly via rustup in-job.
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo +nightly update -Zdirect-minimal-versions
      - run: cargo +nightly check --workspace --all-targets

  # Main-only (issue #174): the small real feature matrix, not a powerset.
  feature-combinations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: taiki-e/install-action@39fa37110d4f0b0312682d675dbf52e40db30cb4 # cargo-hack
      # `--each-feature` on these crates exercises the `kernel` feature,
      # which builds libbitcoinkernel from C++ -- install its prerequisites
      # so the matrix runs unexcluded (deep lanes own the C++ toolchain).
      - run: sudo apt-get update && sudo apt-get install -y libboost-dev cmake
      - run: cargo hack check --each-feature --no-dev-deps -p bitcoin-rs-node -p bitcoin-rs-consensus -p bitcoin-rs-storage

  # Full-feature dependency audit: the PR gate's deny job checks the default
  # graph only; the opt-in kernel/full-backend graph is audited here.
  deny-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          rust-version: "1.95.0"
          arguments: --workspace --no-default-features --features ${{ env.FULL_NODE_FEATURES }}

  # WHY: enabled by the kernel-flip commit. Slot for the opt-in kernel oracle
  # lane: with `--features kernel`, replay the committed fixture corpus
  # through bitcoinkernel AND the Rust path and hard-fail on verdict
  # disagreement. The flip commit flips `if` and owns making the gate green;
  # until then the kernel build is exercised by `full-node` above.
  kernel-oracle:
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y libboost-dev cmake
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo test -p bitcoin-rs --test g03_kernel_parity --features kernel -- --ignored --nocapture
